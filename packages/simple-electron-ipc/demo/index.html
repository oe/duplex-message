<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Duplex Message Electron Demo</title>
</head>
<body>
  <h1>Electron RPC with an isolated preload</h1>
  <p>Progress, local cancellation and typed calls through a fixed contextBridge API.</p>
  <button id="download">Start download</button>
  <button id="cancel">Cancel local waiting</button>
  <p id="download-resp" aria-live="polite"></p>
  <button id="get-title">Get title through main → preload RPC</button>
  <p id="get-title-resp" aria-live="polite"></p>
  <button id="get-calc">Calculate 2 + 3 through bidirectional RPC</button>
  <p id="get-calc-resp" aria-live="polite"></p>
  <script src="./dist/render.js"></script>
</body>
</html>
